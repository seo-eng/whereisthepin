<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 Kiva Cup — Recap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#0A1F14; --panel:#10291B; --panel-2:#153322; --line:#2C5239;
  --text:#FFFFFF; --muted:#BFD0C5; --gold:#E6C84A;
  --eur:#4C8DFF; --eur-ink:#0A1F14; --usa:#FF5A5F; --half:#9DB3A6;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(var(--stick-h,200px) + 8px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--body);
  padding:0 0 env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* scoreboard */
header.board{border-bottom:2px solid var(--line)}
.event{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:18px 0 10px}
.event h1{font:700 30px/1 var(--display);margin:0;letter-spacing:.01em}
.event p{margin:0;color:var(--muted);font-size:15px}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;margin:6px 0 14px;border:2px solid var(--line);border-radius:6px;overflow:hidden}
.team{display:flex;align-items:center;gap:14px;padding:12px 18px}
.team.A{background:var(--eur);color:var(--eur-ink)}
.team.B{background:var(--usa);color:var(--eur-ink);justify-content:flex-end}
.team .nm{font:700 26px/1 var(--display);text-transform:none}
.team .pts{font:700 64px/1 var(--display)}
.abbr{display:none}
@media (max-width:480px){.full{display:none}.abbr{display:inline}}
.score .mid{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px 16px;background:var(--panel);min-width:150px;text-align:center}
.score .mid b{font:700 20px/1.1 var(--display);color:var(--gold)}
.score .mid span{font-size:13px;color:var(--muted)}
@media (max-width:620px){.team .pts{font-size:42px}.team .nm{font-size:18px}.score .mid{min-width:0;max-width:110px;padding:6px}.score .mid b{font-size:16px}.team{padding:10px;gap:8px}}

/* tabs */

/* hero (not sticky) */
.hero{padding-top:16px}
.hero-frame{position:relative;height:clamp(120px,21vw,230px);overflow:hidden;border-radius:6px;border:2px solid var(--line);background:#2a2a22}
.hero-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 62%}
.stick{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
nav.tabs{background:var(--bg);border-bottom:2px solid var(--line)}
.stick .event,.stick .team,.stick .team .pts,.stick .score{transition:all .18s ease}
.stick.compact .event{display:none}
.stick.compact .score{margin:8px 0}
.stick.compact .team{padding:6px 14px}
.stick.compact .team .pts{font-size:38px}
.stick.compact .team .nm{font-size:20px}
.stick.compact .score .mid b{font-size:17px}


.rrow{display:none}
@media (max-width:620px){
  .score .rstrip{display:none}
  .rrow{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:2px solid var(--line)}
  .rr{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:5px 2px;font:700 16px/1 var(--display);border-left:1px solid var(--line)}
  .rr:first-child{border-left:0}
  .rr small{font:600 11px/1 var(--body);color:var(--muted)}
  .rr i{font-style:normal}
  .rr.sel{background:var(--gold)}.rr.sel small{color:var(--bg)}.rr.sel i.eur{color:#1647A8}.rr.sel i.usa{color:#A81E24}
}
.tcol{display:flex;flex-direction:column;gap:6px}
.team.B .tcol{align-items:flex-end}
.rstrip{display:flex;gap:4px}
.rbox{display:flex;flex-direction:column;align-items:center;min-width:34px;padding:3px 4px;border-radius:4px;background:rgba(10,31,20,.16);font:700 16px/1 var(--display)}
.rbox small{font:600 10px/1.1 var(--body);opacity:.8}
.rbox.won{background:rgba(10,31,20,.32)}
.rbox.sel{background:var(--bg);color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.stick.compact .rbox{min-width:28px;font-size:14px;padding:2px 3px}
.stick.compact .rbox small{display:none}
.stick.compact .tcol{gap:3px}
@media (max-width:620px){.rbox{min-width:24px;font-size:13px;padding:2px}.rbox small{font-size:9px}.rstrip{gap:2px}.score .mid span{display:none}}

.score .mid span{line-height:1.3}
@media (prefers-reduced-motion:reduce){.stick .event,.stick .team,.stick .team .pts,.stick .score{transition:none}}
/* round selector */
.roundtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.roundtabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px;background:var(--panel);border:2px solid var(--line);border-radius:8px;cursor:pointer;color:var(--text)}
.roundtabs button b{font:700 24px/1 var(--display)}
.roundtabs .fmt{font-size:14px;color:var(--muted)}
.roundtabs .rs{font:700 22px/1 var(--display);margin-top:2px;white-space:nowrap}
.roundtabs .fmt{white-space:nowrap}
.roundtabs .rt{font:600 13px/1.2 var(--body);color:var(--muted);white-space:nowrap}
.roundtabs button[aria-pressed="true"] .rt{color:var(--bg)}
.roundtabs .rs i{font-style:normal;padding:0 3px}
.roundtabs button:hover{border-color:var(--gold)}
.roundtabs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.roundtabs button[aria-pressed="true"] .fmt{color:var(--bg)}
.roundtabs button[aria-pressed="true"] .rs i.eur{color:#1647A8}.roundtabs button[aria-pressed="true"] .rs i.usa{color:#A81E24}
@media (max-width:560px){.roundtabs{gap:6px}.roundtabs button{padding:10px 2px}.roundtabs button b{font-size:18px}.roundtabs .fmt{font-size:12px}.roundtabs .day{display:none}.roundtabs .rs{font-size:18px}.roundtabs .rs i{padding:0 1px}}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs a{flex:none;padding:14px 14px 12px;color:var(--muted);text-decoration:none;font:600 18px/1 var(--display);border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--text);border-color:var(--gold)}

main{padding:22px 0 60px}
section.view{display:none}
section.view.on{display:block}
h2{font:700 24px/1.15 var(--display);margin:30px 0 10px}
h2:first-child{margin-top:4px}
h3{font:600 19px/1.2 var(--display);margin:0 0 8px}
.lede{color:var(--muted);max-width:68ch;margin:0 0 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.eur{color:var(--eur)} .usa{color:var(--usa)} .gold{color:var(--gold)}
.chip{display:inline-block;padding:2px 8px;border-radius:4px;font:700 15px/1.3 var(--display);white-space:nowrap}
.chip.A{background:var(--eur);color:var(--eur-ink)} .chip.B{background:var(--usa);color:var(--eur-ink)} .chip.H{background:var(--half);color:var(--eur-ink)}
.scroll{overflow-x:auto}

/* tables */
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 15px/1.2 var(--display);color:var(--muted)}
th button{background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit}
th button[aria-sort]{color:var(--gold)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.teamA td:first-child{box-shadow:inset 4px 0 0 var(--eur)}
tr.teamB td:first-child{box-shadow:inset 4px 0 0 var(--usa)}

/* rounds strip */
.rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rounds div{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center}
.rounds small{display:block;color:var(--muted);font-size:13px}
.rounds b{font:700 26px/1.1 var(--display)}
@media (max-width:560px){.rounds{grid-template-columns:repeat(2,1fr)}}

/* bars */
.bar{display:flex;height:22px;border-radius:4px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%}
.bar .A{background:var(--eur)} .bar .H{background:var(--half)} .bar .B{background:var(--usa)}

/* match list */
.seg{display:inline-flex;border:2px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.seg button{background:none;border:0;padding:8px 14px;cursor:pointer;font:600 17px/1 var(--display);color:var(--muted);white-space:nowrap}
@media (max-width:480px){.seg button{padding:8px 9px;font-size:16px}}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--bg)}
.match{border:1px solid var(--line);border-radius:6px;background:var(--panel);margin-bottom:10px}
.match > button{display:grid;grid-template-columns:1fr minmax(120px,240px) 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 14px;background:none;border:0;cursor:pointer;text-align:left}
.match .side{font:600 19px/1.15 var(--display)}
.match .side.A{border-left:4px solid var(--eur);padding-left:8px}
.match .side.B{border-right:4px solid var(--usa);padding-right:8px;text-align:right}
.match .side small{display:block;font:400 13px/1.3 var(--body);color:var(--muted)}
.match .res{min-width:76px;text-align:right}
@media (max-width:640px){
  .match > button{grid-template-columns:1fr 1fr;grid-template-areas:"a b" "spark spark" "res res"}
  .match .side.A{grid-area:a}.match .side.B{grid-area:b}.match .spark{grid-area:spark}.match .res{grid-area:res;text-align:left}
}
.detail{border-top:1px solid var(--line);padding:14px}
.holes td,.holes th{padding:6px 4px;text-align:center;min-width:34px}
.holes th[scope=row]{text-align:left;padding-right:10px;min-width:70px;position:sticky;left:0;background:var(--panel);z-index:1}
.lead{font:700 14px/1 var(--display)}
/* scorecard: light card for contrast */
.scorecard{overflow-x:auto;border:2px solid #FFFFFF;border-radius:6px;background:#FFFFFF;margin:6px 0 8px}
.scorecard table{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed;background:#FFFFFF;color:#0A1F14;font:600 17px/1 var(--display)}
.scorecard th,.scorecard td{border:1px solid #6F8778;padding:8px 2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:clip;position:relative}
.scorecard th[scope=row]{position:sticky;left:0;z-index:1;background:#FFFFFF;text-align:left;padding:8px 10px;width:124px;white-space:normal;line-height:1.15;font:700 16px/1.1 var(--display);color:#0A1F14}

.scorecard .sum{background:#E3ECE6;font-weight:700;width:58px;white-space:normal;line-height:1.15}
.scorecard .tot{width:84px}

.scorecard tr.sc-yds td{font-weight:500}
.scorecard tr.sc-hcp td{font-weight:500;font-size:15px}
.scorecard tr.sc-par td{font-weight:700}
.scorecard .sc-side small{font:600 13px/1 var(--body);opacity:.85}
.scorecard tr.sc-team.sc-A th[scope=row]{box-shadow:inset 6px 0 0 #1F5FD6;padding-left:14px}
.scorecard tr.sc-team.sc-B th[scope=row]{box-shadow:inset 6px 0 0 #D2272E;padding-left:14px}
.scorecard .sc-side.sc-A{color:#1647A8}.scorecard .sc-side.sc-B{color:#A81E24}
.scorecard tr.sc-team td{font:700 17px/1 var(--display);padding:16px 2px 12px}
.scorecard tr.sc-team .sum{font-size:16px}
.scorecard tr.sc-team .sum b{display:block}
.scorecard tr.sc-A .sum b{color:#1647A8}.scorecard tr.sc-B .sum b{color:#A81E24}
.scorecard .sksum{display:block;font:600 12px/1.3 var(--body);color:#3A4A40;margin-top:2px}
.scorecard .sk{position:absolute;top:3px;right:4px;font-size:11px;line-height:1;letter-spacing:1px}
/* column colors: who leads after the hole */
.scorecard td.c-A{background:#1F5FD6;color:#FFFFFF;border-color:#174BAD}
.scorecard td.c-B{background:#D2272E;color:#FFFFFF;border-color:#A81E24}
.scorecard td.c-AS{background:#E6C84A;color:#0A1F14;border-color:#B89A22}
.scorecard td.c-np{background:#F1F4F2;color:#3A4A40}
.scorecard tr.sc-time td{font:600 13px/1 var(--display);letter-spacing:-.01em}
.scorecard tr.sc-time td.approx{font-style:italic}
.scorecard tr.sc-time td.c-np.approx{color:#7A4E00}
/* scorecard row colors */
.scorecard tr.sc-hdr th,.scorecard tr.sc-hdr th[scope=row]{background:#CFE8D5;color:#0A1F14;font-weight:700}
.scorecard tr.sc-hdr .sum{background:#A8D4B3;color:#0A1F14}
.scorecard tr.sc-yds td,.scorecard tr.sc-yds th[scope=row]{background:#A9CBF2;color:#0A1F14}
.scorecard tr.sc-yds .sum{background:#86B4EA}
.scorecard tr.sc-par td,.scorecard tr.sc-par th[scope=row]{background:#E2E5E3;color:#0A1F14}
.scorecard tr.sc-par .sum{background:#CBD0CD}
.scorecard tr.sc-hcp td,.scorecard tr.sc-hcp th[scope=row]{background:#FFFFFF;color:#0A1F14}
.scorecard tr.sc-hcp .sum{background:#F0F2F1}
.scorecard tr.sc-time td,.scorecard tr.sc-time th[scope=row]{background:#FFFFFF}
.scorecard tr.sc-time td.approx{color:#7A4E00}
.scorecard tr.sc-team .sum{background:#E3ECE6}
.scorecard tr.sc-team td.c-np{background:#F7F9F8}

@media (max-width:640px){.scorecard table{min-width:1240px}.scorecard th[scope=row]{width:110px}}

.cell{display:block;border-radius:3px;font:700 14px/26px var(--display)}
.cell.A{background:var(--eur);color:var(--eur-ink)} .cell.B{background:var(--usa);color:var(--eur-ink)} .cell.H{background:var(--half);color:var(--eur-ink)}
.dots{letter-spacing:1px;font-size:12px}
.t{font-size:12px;color:var(--muted)} .t.approx{color:var(--gold)}
.notes{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.notes li{display:flex;gap:12px;align-items:flex-start}
.notes img{width:96px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex:none}
.meta{color:var(--muted);font-size:14px}
.chartbox{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:10px 6px 4px;margin-bottom:6px;overflow:hidden}
.leadchart{display:block;max-width:100%;height:auto;margin:0 auto;cursor:crosshair}
.leadchart .hit{cursor:pointer}
.seg.model{margin-bottom:8px}
.readout{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:8px;min-height:84px}
.readout .where{font:700 18px/1.2 var(--display)}
.readout .what{color:var(--muted);font-size:14px}
.readout .pct{grid-row:span 2;font:700 40px/1 var(--display);color:var(--gold);text-align:right}
.readout .pct small{display:block;font:500 13px/1.3 var(--body);color:var(--muted)}
.readout .split{grid-column:1/-1;display:flex;height:14px;border-radius:3px;overflow:hidden}
.readout .split i{display:block;height:100%}
.readout .legend{grid-column:1/-1;font-size:13px;color:var(--muted)}
@media (max-width:480px){.readout .pct{font-size:32px}}

/* timeline (replay) */
.tl-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.tl-wrap{display:grid;grid-template-columns:330px 1fr;gap:24px;align-items:start}
.replay{position:sticky;top:calc(var(--stick-h,200px) + 10px);background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:14px;max-height:calc(100vh - var(--stick-h,200px) - 20px);overflow:auto}
.rp-top{display:flex;gap:14px;align-items:center}
.clock{width:84px;height:84px;flex:none}
.rp-time{display:flex;flex-direction:column;gap:2px}
.rp-time b{font:700 38px/1 var(--display);color:var(--gold)}
.rp-time span{font-size:14px;color:var(--muted)}
.rp-cup{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 10px}
.rp-team{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:6px;color:var(--bg);font:700 18px/1 var(--display)}
.rp-team b{font-size:38px}
.rp-team.A{background:var(--eur)}.rp-team.B{background:var(--usa)}
.rp-bar{grid-column:1/-1;position:relative;display:flex;justify-content:space-between;height:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;overflow:visible}
.rp-bar i{display:block;height:100%}.rp-bar i.A{background:var(--eur)}.rp-bar i.B{background:var(--usa)}
.rp-bar em{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--gold);transform:translateX(-50%)}
.rp-need{grid-column:1/-1;font-size:13px;color:var(--muted)}
.rp-matches{display:grid;gap:6px}
.chip2{display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center;padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--bg);border:2px solid transparent}
.chip2 .g{grid-row:span 2;font:700 15px/1 var(--display);opacity:.85}
.chip2 .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip2 b{font:700 17px/1.1 var(--display)}
.chip2.A{background:var(--eur)}.chip2.B{background:var(--usa)}.chip2.AS{background:var(--gold)}
.chip2.idle{background:transparent;color:var(--muted);border-color:var(--line)}
.chip2.live{border-color:var(--text);box-shadow:0 0 0 2px var(--bg) inset}
.chip2 .tag{font:700 11px/1 var(--body);letter-spacing:.02em;margin-right:4px;padding:2px 4px;border-radius:3px;background:var(--bg);color:var(--text);vertical-align:2px}
.tl-day{margin:6px 0 12px}
.tl2{list-style:none;margin:0 0 24px;padding:0;position:relative}
.tl2::before{content:"";position:absolute;left:92px;top:0;bottom:0;width:3px;background:var(--line)}
.ev{display:grid;grid-template-columns:80px 1fr;gap:26px;margin-bottom:12px;position:relative}
.ev::before{content:"";position:absolute;left:86px;top:14px;width:15px;height:15px;border-radius:50%;background:var(--half);border:3px solid var(--bg)}
.ev.sA::before{background:var(--eur)}.ev.sB::before{background:var(--usa)}
.ev.clinch::before,.ev.round-end::before,.ev.round-start::before{background:var(--gold)}
.ev .when{text-align:right;padding-top:10px}
.ev time{font:700 18px/1 var(--display);color:var(--text)}
.ev.small time{font-size:15px;color:var(--muted)}
.ev .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;border-left:6px solid var(--line)}
.ev .pill{display:inline-block;font:700 13px/1 var(--display);padding:4px 7px;border-radius:4px;background:var(--panel-2);color:var(--muted);margin-bottom:6px;border:1px solid var(--line)}
.ev .head{font:600 20px/1.2 var(--display)}
.ev .sub{color:var(--muted);font-size:14px;margin-top:3px}
.ev .sub a{color:var(--text)}
.ev .cupnow{margin-top:8px;font:600 16px/1 var(--display);background:var(--bg);display:inline-block;padding:6px 10px;border-radius:4px;border:1px solid var(--line)}
.ev .ph img{display:block;margin-top:8px;width:200px;max-width:100%;height:130px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
/* big moment styles */
.ev.lead-change .card,.ev.run .card{border-left-color:var(--half)}
.ev.sA.lead-change .card,.ev.sA.run .card{border-left-color:var(--eur)}
.ev.sB.lead-change .card,.ev.sB.run .card{border-left-color:var(--usa)}
.ev.lead-change .pill,.ev.run .pill{background:var(--text);color:var(--bg)}
.ev.final .card{background:var(--panel-2);border-width:2px;border-left-width:8px}
.ev.final.sA .card{border-color:var(--eur)}.ev.final.sB .card{border-color:var(--usa)}.ev.final:not(.sA):not(.sB) .card{border-color:var(--half)}
.ev.final.sA .pill{background:var(--eur);color:var(--bg);border-color:var(--eur)}
.ev.final.sB .pill{background:var(--usa);color:var(--bg);border-color:var(--usa)}
.ev.final .head{font-size:24px}
.ev.round-start .card{background:transparent;border:2px dashed var(--gold);border-left:6px solid var(--gold)}
.ev.round-start .pill,.ev.round-end .pill{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.ev.round-end .card{border:2px solid var(--gold);border-left:8px solid var(--gold)}
.ev.round-end .head{font-size:24px}
.ev.clinch .card{background:var(--gold);color:var(--bg);border:2px solid var(--gold);padding:16px 18px}
.ev.clinch .head{font:700 34px/1.05 var(--display)}
.ev.clinch .sub{color:var(--bg);font-size:16px}
.ev.clinch .pill{background:var(--bg);color:var(--gold);border-color:var(--bg)}

.ev.note .head{font:italic 500 18px/1.35 var(--body)}
.ev.cur .card{box-shadow:0 0 0 3px var(--gold)}
.tl-how{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:6px;padding:10px 14px;margin:0 0 12px;color:var(--muted);font-size:15px}
.tl-how b{color:var(--text)}
.nowtag{display:inline-block;background:var(--gold);color:var(--bg);font:700 12px/1 var(--display);padding:4px 7px;border-radius:4px;margin-right:6px;vertical-align:1px}
.ev .card .nowtag{display:none;float:right;margin:0 0 0 8px}
.ev.cur .card .nowtag{display:inline-block}
.ev{cursor:pointer}
.ev.clinch.cur .card .nowtag{background:var(--bg);color:var(--gold)}

@media (max-width:900px){
  .tl-wrap{grid-template-columns:1fr;gap:12px}

  /* ---------- handicaps ---------- */
  const strokesOnHole = (n, hole) => {

    const s = side => m[side.toLowerCase()].reduce((t, p) => t + strokesOnHole(al.per[p], hole), 0);

  const mins = ts => new Date(ts).getTime() / 60000;

  function analyzeMatch(m, rows) {
    const byHole = {};
    rows.forEach(r => { byHole[r.hole] = r; });
    const holes = [];
    for (let h = 1; h <= 18; h++) { if (!byHole[h]) break; holes.push(byHole[h]); } // stop at first gap
    let lead = 0, prevSign = 0, leadChanges = 0, maxA = 0, maxB = 0, closedAt = null;

    }

        const sg = Math.sign(p.lead);

    });

    moments.sort((x, y) => x.ts < y.ts ? -1 : x.ts > y.ts ? 1 : 0);


    /* ---------- win probability models ----------
       'score' (default): broadcast-style, based only on the match score and holes left.
         Each remaining hole is halved at that format's halve rate measured from this
         tournament's holes; otherwise either side is equally likely to win it.
         Every match starts at 50%.
       'strokes' (optional): same, but each remaining hole uses this tournament's results

         getting the edge) or no edge (even split). A format with fewer than 30 holes of a
         kind uses all formats pooled. Matches can start well away from 50%. */
    const MIN_N = 30;
    const fmtCounts = {};
    matches.forEach(m => {
      const f = fmtCounts[ROUNDS[m.round].format] = fmtCounts[ROUNDS[m.round].format] || { H: 0, n: 0 };
      m.holes.forEach(p => { f.n++; if (p.result === 'H') f.H++; });

    const model = { halveRate: {}, strokes: { byFormat: {} } };
    Object.entries(fmtCounts).forEach(([k, f]) => { model.halveRate[k] = { rate: f.n ? f.H / f.n : 1 / 3, n: f.n }; });

    const pool = { even: { A: 0, B: 0, H: 0 }, win: 0, half: 0, loss: 0, n: 0 };
    Object.values(strokeFx).forEach(f => {

      model.strokes.byFormat[fmt] = {
        even: ev.n >= MIN_N ? ev : model.strokes.pooled.even, evenPooled: ev.n < MIN_N,
        edge: ed && ed.n >= MIN_N ? ed : model.strokes.pooled.edge, edgePooled: !(ed && ed.n >= MIN_N)
      };
    });

    const ODDS = {
      score(m) {
        const hr = (model.halveRate[ROUNDS[m.round].format] || { rate: 1 / 3 }).rate, s = (1 - hr) / 2;
        return { A: s, H: hr, B: s };
      },
      strokes(m, hole) {
        const r = model.strokes.byFormat[ROUNDS[m.round].format] || model.strokes.pooled;
        const st = sideStrokes(m, hole), edge = st.A - st.B;
        if (!edge) return { A: r.even.side, H: r.even.half, B: r.even.side };
        return edge > 0 ? { A: r.edge.win, H: r.edge.half, B: r.edge.loss } : { A: r.edge.loss, H: r.edge.half, B: r.edge.win };
      }
    };
    function winProb(m, afterHole, lead, odds) {
      let dist = new Map([[lead, 1]]);

        const o = odds(m, h), next = new Map();
        dist.forEach((p, l) => {
          if (Math.abs(l) > 18 - (h - 1)) { next.set(l, (next.get(l) || 0) + p); return; } // already decided
          next.set(l + 1, (next.get(l + 1) || 0) + p * o.A);
          next.set(l, (next.get(l) || 0) + p * o.H);
          next.set(l - 1, (next.get(l - 1) || 0) + p * o.B);

      }
      const out = { A: 0, H: 0, B: 0 };
      dist.forEach((p, l) => { out[l > 0 ? 'A' : l < 0 ? 'B' : 'H'] += p; });
      out.share = out.A + out.H / 2; // Europe's expected share of the point
      return out;
    }
    matches.forEach(m => {
      m.probs = {}; m.swings = {};
      Object.entries(ODDS).forEach(([key, odds]) => {
        const arr = [winProb(m, 0, 0, odds), ...m.holes.map(p => winProb(m, p.hole, p.lead, odds))];
        arr.forEach((p, i) => { p.swing = i ? p.share - arr[i - 1].share : 0; });
        let big = 0; arr.forEach((p, i) => { if (Math.abs(p.swing) > Math.abs(arr[big].swing)) big = i; });
        m.probs[key] = arr; m.swings[key] = big ? { hole: big, swing: arr[big].swing } : null;
      });
      m.prob = m.probs.score; m.biggestSwing = m.swings.score; // defaults
    });
    return { matches, total, byRound, race, clinch, holeStats, nines, strokeFx, model, players, pairs: Object.values(pairs), comebacks, moments,
      mismatches: matches.filter(m => m.done && !m.matchesOfficial).map(m => m.id) };
  }

  const API = { SUPABASE_URL, SUPABASE_KEY, EVENT, TEAMS, COURSE, PLAYERS, ROUNDS, MATCHES, OFFICIAL,
    strokesOnHole, allowances, sideStrokes, analyzeMatch, analyze, fmtTime };
  if (typeof module !== 'undefined') module.exports = API; else root.KivaRecap = API;
})(this);

    return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="Lead by hole">
      <defs><clipPath id="up${m.id}"><rect x="0" y="0" width="${w}" height="${h / 2}"/></clipPath><clipPath id="dn${m.id}"><rect x="0" y="${h / 2}" width="${w}" height="${h / 2}"/></clipPath></defs>
      <line x1="0" x2="${w}" y1="${h / 2}" y2="${h / 2}" stroke="var(--line)" stroke-width="1"/>
      <line x1="${x(9)}" x2="${x(9)}" y1="2" y2="${h - 2}" stroke="var(--line)" stroke-dasharray="2 3"/>
      <path d="${area}" fill="var(--eur)" opacity=".35" clip-path="url(#up${m.id})"/>
      <path d="${area}" fill="var(--usa)" opacity=".35" clip-path="url(#dn${m.id})"/>
      <path d="${line}" fill="none" stroke="var(--text)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    </svg>`;
  }

  function leadChart(m) {
    const main = document.querySelector('main');
    const w = Math.round(Math.max(320, Math.min(1000, (main ? main.clientWidth : 900) - 34)));
    const narrow = w < 560, h = narrow ? 260 : 320;
    const pad = { l: narrow ? 34 : 44, r: narrow ? 42 : 52, t: 30, b: 46 };
    const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
    const peak = Math.max(...m.path.map(Math.abs), 0);
    const max = Math.max(3, peak + (peak >= 3 ? 1 : 0));
    const x = hole => pad.l + (hole / 18) * iw, y = v => pad.t + ih / 2 - (v / max) * (ih / 2), y0 = y(0);
    const step = max <= 5 ? 1 : 2;
    let g = '';
    // played / unplayed background
    if (m.done && m.thru < 18) {
      g += `<rect x="${x(m.thru)}" y="${pad.t}" width="${x(18) - x(m.thru)}" height="${ih}" fill="var(--bg)" opacity=".55"/>`;
      if (x(18) - x(m.thru) > 60) g += `<text x="${(x(m.thru) + x(18)) / 2}" y="${pad.t + ih - 8}" text-anchor="middle" fill="var(--muted)" font-size="13">Not played</text>`;
    }
    // y grid + labels
    for (let v = -max; v <= max; v++) {
      if (v % step) continue;
      const yy = y(v), col = v > 0 ? 'var(--eur)' : v < 0 ? 'var(--usa)' : 'var(--muted)';
      g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${yy}" y2="${yy}" stroke="var(--line)" ${v ? '' : 'stroke-width="2"'}/>`;
      g += `<text x="${pad.l - 8}" y="${yy + 4}" text-anchor="end" fill="${col}" font-size="13">${v === 0 ? 'AS' : Math.abs(v)}</text>`;
    }
    const yp = share => pad.t + ih * (1 - share);
    [0, .25, .5, .75, 1].forEach(v => { g += `<text x="${w - pad.r + 8}" y="${yp(v) + 4}" fill="var(--gold)" font-size="13">${v * 100}%</text>`; });
    g += `<text x="${w - 4}" y="${pad.t - 10}" text-anchor="end" fill="var(--gold)" font-size="14" font-weight="600">Europe win %</text>`;
    g += `<text x="${pad.l + 6}" y="${pad.t - 10}" fill="var(--eur)" font-size="14" font-weight="600" stroke="var(--panel-2)" stroke-width="4" paint-order="stroke">Europe up ▲</text>`;
    g += `<text x="${pad.l + 6}" y="${pad.t + ih + 0}" dy="-6" fill="var(--usa)" font-size="14" font-weight="600" stroke="var(--panel-2)" stroke-width="4" paint-order="stroke">USA up ▼</text>`;
    // x ticks
    for (let hole = 1; hole <= 18; hole++) {
      g += `<line x1="${x(hole)}" x2="${x(hole)}" y1="${pad.t + ih}" y2="${pad.t + ih + 5}" stroke="var(--muted)"/>`;
      if (!narrow || hole % 2 === 1) g += `<text x="${x(hole)}" y="${pad.t + ih + 19}" text-anchor="middle" fill="var(--muted)" font-size="13">${hole}</text>`;
    }
    g += `<text x="${pad.l + iw / 2}" y="${h - 6}" text-anchor="middle" fill="var(--muted)" font-size="14">Hole</text>`;
    g += `<line x1="${x(9)}" x2="${x(9)}" y1="${pad.t}" y2="${pad.t + ih}" stroke="var(--line)" stroke-dasharray="4 4"/>`;
    // lead line with area
    const pts = [[x(0), y0], ...m.path.map((v, i) => [x(i + 1), y(v)])];
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = `${line} L${pts[pts.length - 1][0].toFixed(1)} ${y0} L${x(0)} ${y0} Z`;
    const cid = 'lc' + m.id;
    g += `<defs><clipPath id="${cid}u"><rect x="0" y="0" width="${w}" height="${y0}"/></clipPath><clipPath id="${cid}d"><rect x="0" y="${y0}" width="${w}" height="${h - y0}"/></clipPath></defs>`;
    g += `<path d="${area}" fill="var(--eur)" opacity=".3" clip-path="url(#${cid}u)"/><path d="${area}" fill="var(--usa)" opacity=".3" clip-path="url(#${cid}d)"/>`;
    g += `<path d="${line}" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linejoin="round"/>`;
    const PR = m.probs[state.model];
    const pline = PR.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + yp(p.share).toFixed(1)).join(' ');
    g += `<path d="${pline}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-dasharray="7 4" stroke-linejoin="round"/>`;
    PR.forEach((p, i) => { g += `<circle cx="${x(i)}" cy="${yp(p.share)}" r="3" fill="var(--gold)"/>`; });
    g += `<g class="hl" data-x0="${pad.l}" data-step="${iw / 18}"><line x1="0" x2="0" y1="${pad.t}" y2="${pad.t + ih}" stroke="var(--gold)" stroke-width="2" opacity=".8"/>
      <circle class="hl-p" r="7" fill="none" stroke="var(--gold)" stroke-width="3"/><circle class="hl-l" r="9" fill="none" stroke="var(--text)" stroke-width="2.5"/></g>`;
    // hole dots
    const fill = { A: 'var(--eur)', B: 'var(--usa)', H: 'var(--half)' };
    m.holes.forEach(p => {
      const status = p.lead === 0 ? 'all square' : `${T[p.lead > 0 ? 'A' : 'B'].name} ${Math.abs(p.lead)} up`;
      const won = p.result === 'H' ? 'halved' : `${T[p.result].name} won`;
      g += `<circle cx="${x(p.hole)}" cy="${y(p.lead)}" r="${narrow ? 4.5 : 5.5}" fill="${fill[p.result]}" stroke="var(--bg)" stroke-width="1.5"><title>Hole ${p.hole}: ${won}. ${status}.</title></circle>`;
    });
    // final marker
    if (m.done) {
      const last = m.holes[m.holes.length - 1], fx = x(last.hole), fy = y(last.lead);
      const txt = m.winner ? `${T[m.winner].short} ${m.label}` : 'Halved';
      const anchor = last.hole >= 15 ? 'end' : 'start', dx = anchor === 'end' ? -10 : 10;
      g += `<text x="${fx + dx}" y="${fy + (last.lead >= 0 ? -10 : 20)}" text-anchor="${anchor}" fill="var(--gold)" font-size="15" font-weight="700">${esc(txt)}</text>`;
    }
    for (let i = 0; i <= m.thru; i++) g += `<rect class="hit" data-i="${i}" x="${x(i) - iw / 36}" y="${pad.t - 4}" width="${iw / 18}" height="${ih + 30}" fill="transparent"/>`;
    m._chart = { x, y, yp };
    return `<svg class="leadchart" data-match="${m.id}" tabindex="0" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Match lead and Europe win chance after each hole for ${m.id}. Use left and right arrow keys to step through holes.">${g}</svg>`;
  }

  function raceChart() {
    const r = A.race, w = 900, h = 300, pad = { l: 34, r: 16, t: 14, b: 34 };
    const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b, ymax = 20;
    const x = i => pad.l + (i / r.length) * iw, y = v => pad.t + ih - (v / ymax) * ih;
    const step = side => { let d = `M${x(0)} ${y(0)}`; r.forEach((e, i) => { d += ` H${x(i + 1)} V${y(e[side])}`; }); return d; };
    let g = '';
    for (let v = 0; v <= ymax; v += 5) g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" fill="var(--muted)" font-size="13">${v}</text>`;
    g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y(15.5)}" y2="${y(15.5)}" stroke="var(--gold)" stroke-dasharray="6 4"/><text x="${pad.l + 6}" y="${y(15.5) - 6}" fill="var(--gold)" font-size="14">15½ to win</text>`;
    let prev = 0;
    [1, 2, 3, 4].forEach(rd => {
      const n = r.filter(e => e.round === rd).length, x0 = x(prev), x1 = x(prev + n);
      g += `<line x1="${x1}" x2="${x1}" y1="${pad.t}" y2="${pad.t + ih}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${(x0 + x1) / 2}" y="${h - 10}" text-anchor="middle" fill="var(--muted)" font-size="14">${K.ROUNDS[rd].label}</text>`;
      prev += n;
    });
    const ci = A.clinch ? r.findIndex(e => e.id === A.clinch.id) : -1;
    const clinchMark = ci >= 0 ? `<circle cx="${x(ci + 1)}" cy="${y(r[ci][A.clinch.side])}" r="6" fill="var(--gold)"/>` : '';
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Points race: cumulative points as matches finished">${g}
      <path d="${step('B')}" fill="none" stroke="var(--usa)" stroke-width="3"/>
      <path d="${step('A')}" fill="none" stroke="var(--eur)" stroke-width="3"/>${clinchMark}</svg>`;
  }

  const bar = (a, hh, b) => { const n = a + hh + b || 1; return `<div class="bar" role="img" aria-label="Europe ${a}, halved ${hh}, USA ${b}"><i class="A" style="width:${a / n * 100}%"></i><i class="H" style="width:${hh / n * 100}%"></i><i class="B" style="width:${b / n * 100}%"></i></div>`; };

  /* ---------- views ---------- */
  const cumThrough = r => { const t = { A: 0, B: 0 }; for (let i = 1; i <= r; i++) { t.A += A.byRound[i].A; t.B += A.byRound[i].B; } return t; };
  function renderHeader() {
    const E = K.EVENT;
    $('#evName').textContent = E.name;
    $('#evMeta').textContent = `${E.venue}, ${E.place}. ${E.dates}. ${E.tees} tees, ${E.yards.toLocaleString()} yds, ${E.rating}`;
    // big numbers: Cup total; small boxes: each round's points, selected round highlighted on Matches
    const sel = state.view === 'matches' ? state.round : null;
    // big numbers: running Cup total — through the selected round on Matches, otherwise the final total
    const tot = sel ? cumThrough(sel) : A.total;
    $('#ptsA').textContent = half(tot.A) || 0; $('#ptsB').textContent = half(tot.B) || 0;
    ['A', 'B'].forEach(sd => {
      $('#strip' + sd).innerHTML = [1, 2, 3, 4].map(r => {
        const v = A.byRound[r][sd], o = A.byRound[r][sd === 'A' ? 'B' : 'A'];
        return `<span class="rbox${r === sel ? ' sel' : ''}${v > o ? ' won' : ''}" title="${K.ROUNDS[r].label}: ${T[sd].name} ${half(v) || 0}"><small>R${r}</small>${half(v) || 0}</span>`;
      }).join('');
    });
    $('#roundRow').innerHTML = [1, 2, 3, 4].map(r => { const v = A.byRound[r];
      return `<span class="rr${r === sel ? ' sel' : ''}"><small>R${r}</small><i class="eur">${half(v.A) || 0}</i>–<i class="usa">${half(v.B) || 0}</i></span>`; }).join('');
    const allDone = A.matches.every(m => m.done);
    if (sel) {
      const sc = A.byRound[sel], R = K.ROUNDS[sel];
      $('#verdict').textContent = `Total after ${R.label}`;
      $('#verdictSub').textContent = `${R.label} alone: ${half(sc.A) || 0}–${half(sc.B) || 0}`;
      return;
    }
    if (A.clinch) {
      $('#verdict').textContent = A.clinch.side === 'A' ? 'Europe win the Cup' : 'USA retain the Cup';
      $('#verdictSub').textContent = allDone ? 'Final' : 'In progress';
    } else { $('#verdict').textContent = allDone ? 'Final' : 'In progress'; $('#verdictSub').textContent = ''; }
  }


  function renderOverview() {
    const c = A.clinch, cm = c && c.match;
    const fx = A.strokeFx, fxRow = (k, label) => fx[k] ? `<tr><td>${label}</td><td class="num">${fx[k].win}</td><td class="num">${fx[k].half}</td><td class="num">${fx[k].loss}</td><td class="num">${fx[k].n ? pct(fx[k].win / fx[k].n) : '–'}</td></tr>` : '';
    const tot = ['fourball', 'foursomes', 'singles'].reduce((t, k) => fx[k] ? { win: t.win + fx[k].win, half: t.half + fx[k].half, loss: t.loss + fx[k].loss, n: t.n + fx[k].n } : t, { win: 0, half: 0, loss: 0, n: 0 });
    const nn = A.nines;
    $('#v-overview').innerHTML = `
      <h2>Points race</h2>
      <p class="lede">Cumulative points in the order matches finished, using the save time of each match's closing hole.
      ${c ? `The deciding point was <a class="gold" href="#matches/${cm.id}">${names(cm.a)} v ${names(cm.b)}</a> (${esc(cm.id)}, ${esc(cm.label)}) at about ${tm(c.end)} CDT on ${dayOf(c.end)}.` : ''}</p>
      <div class="panel scroll">${raceChart()}</div>

      <h2>By round</h2>
      <div class="rounds">${[1, 2, 3, 4].map(r => `<div><small>${K.ROUNDS[r].label}, ${K.ROUNDS[r].formatLabel}</small><b><span class="eur">${half(A.byRound[r].A)}</span> – <span class="usa">${half(A.byRound[r].B)}</span></b></div>`).join('')}</div>

      <div class="grid2" style="margin-top:16px">
        <div class="panel"><h3>Holes won by nine</h3>
          <p class="meta">Every hole played across all 30 matches.</p>
          <table><tr><th>Nine</th><th class="num">EUR</th><th class="num">Halved</th><th class="num">USA</th><th></th></tr>
          <tr><td>Front</td><td class="num">${nn.front.A}</td><td class="num">${nn.front.H}</td><td class="num">${nn.front.B}</td><td>${bar(nn.front.A, nn.front.H, nn.front.B)}</td></tr>
          <tr><td>Back</td><td class="num">${nn.back.A}</td><td class="num">${nn.back.H}</td><td class="num">${nn.back.B}</td><td>${bar(nn.back.A, nn.back.H, nn.back.B)}</td></tr></table>
        </div>
        <div class="panel"><h3>Side receiving the stroke</h3>
          <p class="meta">Holes where one side had a net stroke edge. Fourball counts how many players on each side got a stroke.</p>
          <table><tr><th>Format</th><th class="num">Won</th><th class="num">Halved</th><th class="num">Lost</th><th class="num">Win rate</th></tr>
          ${fxRow('fourball', 'Fourball')}${fxRow('foursomes', 'Foursomes')}${fxRow('singles', 'Singles')}
          <tr><td><b>All</b></td><td class="num"><b>${tot.win}</b></td><td class="num"><b>${tot.half}</b></td><td class="num"><b>${tot.loss}</b></td><td class="num"><b>${tot.n ? pct(tot.win / tot.n) : '–'}</b></td></tr></table>
        </div>
      </div>

      <h2>Comebacks</h2>
      <p class="lede">Matches won by a side that was 2 or more down.</p>
      <div class="panel scroll"><table>
        <tr><th>Match</th><th>Winner</th><th class="num">Worst deficit</th><th>Result</th><th>Lead by hole</th></tr>
        ${A.comebacks.map(m => `<tr class="team${m.winner}"><td><a class="gold" href="#matches/${m.id}">${m.id}</a></td><td>${names(m[m.winner.toLowerCase()])}</td>
          <td class="num">${m.winnerDeficit} down thru ${m.deficitHole}</td><td><span class="chip ${m.winner}">${T[m.winner].short} ${esc(m.label)}</span></td><td style="width:200px">${spark(m, 200, 34)}</td></tr>`).join('')}
      </table></div>
      ${A.mismatches.length ? `<p class="status err">Hole data disagrees with the official result for: ${A.mismatches.join(', ')}.</p>` : ''}`;
  }

  function scorecard(m) {
    const C = K.COURSE, byH = Object.fromEntries(m.holes.map(p => [p.hole, p]));
    const front = [1, 2, 3, 4, 5, 6, 7, 8, 9], back = [10, 11, 12, 13, 14, 15, 16, 17, 18], all = [...front, ...back];
    const st = h => K.sideStrokes(m, h);
    const sum = (hs, f) => hs.reduce((t, h) => t + f(h), 0);
    // status from one side's point of view: 2UP, 1DN, AS
    const status = (lead, side) => { const v = side === 'A' ? lead : -lead; return v === 0 ? 'AS' : `${Math.abs(v)}${v > 0 ? 'UP' : 'DN'}`; };
    // column color = who leads the match after that hole
    const colCls = h => { const p = byH[h]; return !p ? 'c-np' : p.lead > 0 ? 'c-A' : p.lead < 0 ? 'c-B' : 'c-AS'; };
    const row = (label, cls, cell, tot, total) =>
      `<tr class="${cls}"><th scope="row">${label}</th>${front.map(h => cell(h, colCls(h))).join('')}<td class="sum">${tot(front)}</td>${back.map(h => cell(h, colCls(h))).join('')}<td class="sum">${tot(back)}</td><td class="sum tot">${total()}</td></tr>`;
    const plain = f => h => `<td>${f(h)}</td>`;
    const lastIn = hs => { const ps = hs.map(h => byH[h]).filter(Boolean); return ps.length ? ps[ps.length - 1] : null; };
    const sideRow = side => {
      const name = m[side.toLowerCase()].map(p => `${esc(p)} <small>${K.PLAYERS[p].hcp}</small>`).join(' / ');
      const sk = h => { const n = st(h)[side]; return n ? `<span class="sk" title="${n} stroke${n > 1 ? 's' : ''}">${'●'.repeat(n)}</span>` : ''; };
      const nineTot = hs => { const p = lastIn(hs); const strokes = sum(hs, h => st(h)[side]);
        return `${p ? `<b>${status(p.lead, side)}</b>` : ''}${strokes ? `<span class="sksum">${strokes} str</span>` : ''}`; };
      const total = () => {
        const strokes = sum(all, h => st(h)[side]);
        const res = !m.done ? (m.thru ? `<b>${status(m.lead, side)}</b>` : '') : !m.winner ? '<b>Halved</b>' :
          m.winner === side ? `<b>Won ${esc(m.label)}</b>` : `<b>Lost</b>`;
        return `${res}${strokes ? `<span class="sksum">${strokes} str</span>` : ''}`;
      };
      return row(`<span class="sc-side sc-${side}">${name}</span>`, `sc-team sc-${side}${m.winner === side ? ' sc-won' : ''}`,
        (h, c) => { const p = byH[h]; return `<td class="${c}">${sk(h)}${p ? status(p.lead, side) : ''}</td>`; }, nineTot, total);
    };
    return `<div class="scorecard"><table>
      <tr class="sc-hdr"><th scope="row">Hole</th>${front.map(h => `<th>${h}</th>`).join('')}<th class="sum">Out</th>${back.map(h => `<th>${h}</th>`).join('')}<th class="sum">In</th><th class="sum tot">Tot</th></tr>
      ${row('Blue yds', 'sc-yds', plain(h => C.yards[h - 1]), hs => sum(hs, h => C.yards[h - 1]).toLocaleString(), () => sum(all, h => C.yards[h - 1]).toLocaleString())}
      ${row('Par', 'sc-par', plain(h => C.par[h - 1]), hs => sum(hs, h => C.par[h - 1]), () => 72)}
      ${row('Handicap', 'sc-hcp', plain(h => C.hcp[h - 1]), () => '', () => '')}
      ${sideRow('A')}
      ${sideRow('B')}
      ${row('Time', 'sc-time', (h, c) => { const p = byH[h]; return p ? `<td class="${p.reliable ? '' : 'approx'}">${p.reliable ? '' : '~'}${tm(p.ts).replace(/\s?[AP]M/, '')}</td>` : '<td></td>'; }, () => '', () => '')}
    </table></div>`;
  }

  function matchSummary(m) {
    const sides = ['A', 'B'], other = sd => sd === 'A' ? 'B' : 'A';
    const nm = sd => names(m[sd.toLowerCase()]);
    const pl = m.a.length > 1, were = pl ? 'were' : 'was', they = pl ? 'They' : 'He';
    const sv = (lead, sd) => sd === 'A' ? lead : -lead;
    const H = m.holes, W = m.winner;
    const stat = {};
    sides.forEach(sd => {
      const o = other(sd);
      const won = H.filter(p => p.result === sd).length;
      const f = H.filter(p => p.hole <= 9 && p.result === sd).length, b = H.filter(p => p.hole > 9 && p.result === sd).length;
      const ahead = H.filter(p => sv(p.lead, sd) > 0).length;
      let maxL = 0, maxH = 0; H.forEach(p => { const v = sv(p.lead, sd); if (v > maxL) { maxL = v; maxH = p.hole; } });
      const run = m.longestRun[sd];
      const edge = H.filter(p => (p.strokes[sd] - p.strokes[o]) > 0);
      const ew = edge.filter(p => p.result === sd).length, eh = edge.filter(p => p.result === 'H').length;
      // win chance before the finish (exclude the final state, which is 0 or 100)
      const pr = m.probs[state.model], upto = m.done ? pr.length - 1 : pr.length;
      let hi = { v: -1, i: 0 }, lo = { v: 2, i: 0 };
      for (let i = 0; i < upto; i++) { const v = sd === 'A' ? pr[i].share : 1 - pr[i].share; if (v > hi.v) hi = { v, i }; if (v < lo.v) lo = { v, i }; }
      stat[sd] = { won, f, b, ahead, maxL, maxH, run, edgeN: edge.length, ew, eh, el: edge.length - ew - eh, hi, lo };
    });
    const at = i => i === 0 ? 'before the first tee' : `after hole ${i}`;
    const pctS = v => fmtPct(v);
    // narrative
    const lines = [];
    const firstLead = sd => { const p = H.find(x => sv(x.lead, sd) > 0); return p ? p.hole : null; };
    if (W) {
      const L = other(W), def = m.winnerDeficit;
      const close = m.thru === 18 ? 'on the 18th' : `on the ${m.thru}th`;
      if (def >= 2) lines.push(`${nm(W)} ${were} ${def} down after hole ${m.deficitHole} and came back to win ${esc(m.label)}, closing it out ${close}.`);
      else if (m.leadChanges >= 2) lines.push(`A back-and-forth match with ${m.leadChanges} lead changes. ${nm(W)} won ${esc(m.label)}, closing it out ${close}.`);
      else if (stat[L].ahead === 0) lines.push(`${nm(W)} never trailed. ${they} went ahead on hole ${firstLead(W)} and won ${esc(m.label)} ${close}.`);
      else lines.push(`${nm(W)} won ${esc(m.label)}, closing it out ${close}.`);
    } else if (m.done) {
      lines.push(`Halved. All square after 18${m.leadChanges ? ` with ${m.leadChanges} lead change${m.leadChanges > 1 ? 's' : ''}` : ''}.`);
      let sq = null; H.forEach((p, i) => { if (p.lead === 0 && i && H[i - 1].lead !== 0) sq = p; });
      const big = sides.map(sd => stat[sd]).reduce((x, y) => y.maxL > x.maxL ? y : x);
      const bigSide = stat.A === big ? 'A' : 'B';
      if (big.maxL && sq) lines.push(`${nm(bigSide)} ${were} ${big.maxL} up after hole ${big.maxH}, but ${nm(sq.result)} squared it on hole ${sq.hole}${sq.hole < 18 ? ` and ${18 - sq.hole === 1 ? 'the last was' : `the last ${18 - sq.hole} were`} halved` : ''}.`);
    }
    sides.forEach(sd => { const r = stat[sd].run; if (r.len >= 3) lines.push(`${nm(sd)} won ${r.len} straight holes (${r.from}–${r.from + r.len - 1}).`); });
    const bs = m.swings[state.model];
    if (bs) lines.push(`Biggest swing: hole ${bs.hole}, when ${bs.swing > 0 ? nm('A') : nm('B')} gained ${Math.round(Math.abs(bs.swing) * 100)} points of win chance.`);
    // underdog story
    if (W) { const lo = stat[W].lo; if (lo.v < .25) lines.push(`${nm(W)} ${were} as low as ${pctS(lo.v)} to win ${at(lo.i)}.`); }

    const row = (label, a, b, note) => `<tr><td class="sA">${a}</td><th scope="row">${label}${note ? `<small>${note}</small>` : ''}</th><td class="sB">${b}</td></tr>`;
    const runTxt = r => r.len ? `${r.len}${r.len > 1 ? ` (holes ${r.from}–${r.from + r.len - 1})` : ` (hole ${r.from})`}` : '–';
    const leadTxt = x => x.maxL ? `${x.maxL}UP after ${x.maxH}` : 'Never led';
    const edgeTxt = x => x.edgeN ? `${x.ew}-${x.el}-${x.eh} <span class="t">of ${x.edgeN}</span>` : 'None';
    const notes = H.filter(p => p.note || p.photo);
    const dur = H.length > 1 ? Math.round((new Date(H[H.length - 1].ts) - new Date(H[0].ts)) / 60000) : 0;
    const halves = H.filter(p => p.result === 'H').length;
    return `<section class="msum" aria-label="Match summary">
      <h3>Match summary</h3>
      <div class="msum-lede">${lines.map(l => `<p>${l}</p>`).join('')}</div>
      <div class="scroll"><table class="msum-t">
        <tr class="hd"><td class="sA">${nm('A')}</td><th scope="col">Europe v USA</th><td class="sB">${nm('B')}</td></tr>
        ${row('Holes won', stat.A.won, stat.B.won, `${halves} halved`)}
        ${row('Front 9 / back 9', `${stat.A.f} / ${stat.A.b}`, `${stat.B.f} / ${stat.B.b}`, 'holes won')}
        ${row('Biggest lead', leadTxt(stat.A), leadTxt(stat.B))}
        ${row('Holes in the lead', stat.A.ahead, stat.B.ahead, `${H.length - stat.A.ahead - stat.B.ahead} all square`)}
        ${row('Longest winning run', runTxt(stat.A.run), runTxt(stat.B.run))}
        ${row('Best win chance', `<b>${pctS(stat.A.hi.v)}</b> <span class="t">${at(stat.A.hi.i)}</span>`, `<b>${pctS(stat.B.hi.v)}</b> <span class="t">${at(stat.B.hi.i)}</span>`, 'before the finish')}
        ${row('Lowest win chance', `<b>${pctS(stat.A.lo.v)}</b> <span class="t">${at(stat.A.lo.i)}</span>`, `<b>${pctS(stat.B.lo.v)}</b> <span class="t">${at(stat.B.lo.i)}</span>`)}
        ${row('On holes with a stroke edge', edgeTxt(stat.A), edgeTxt(stat.B), 'won-lost-halved')}
      </table></div>
      <p class="meta">${m.leadChanges} lead change${m.leadChanges === 1 ? '' : 's'}. Win chances use the ${state.model === 'strokes' ? 'Score + strokes' : 'Score only'} setting above (halves count as half a win).${dur && m.reliableShare >= .8 ? ` About ${Math.floor(dur / 60)}h ${String(dur % 60).padStart(2, '0')}m from the first to the last hole saved.` : ''}</p>
      ${notes.length ? `<h3 class="msum-h">Highlights from the course</h3><ul class="notes">${notes.map(p => `<li>${p.photo ? `<a href="${esc(p.photo)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(p.thumb)}" data-full="${esc(p.photo)}" alt="Photo from hole ${p.hole}"></a>` : ''}
        <div><b>Hole ${p.hole}</b> <span class="t">${tm(p.ts)}, ${p.result === 'H' ? 'halved' : T[p.result].name + ' won the hole'}, ${p.lead === 0 ? 'AS' : `${T[p.lead > 0 ? 'A' : 'B'].short} ${Math.abs(p.lead)}UP`}</span><br>${p.note ? esc(p.note) : '<span class="meta">Photo</span>'}</div></li>`).join('')}</ul>` : ''}
    </section>`;
  }

  function matchDetail(m) {
    const al = m.allow, hs = Array.from({ length: 18 }, (_, i) => i + 1);
    const byH = Object.fromEntries(m.holes.map(p => [p.hole, p]));
    const pops = al.kind === 'side'
      ? `Team pops ${al.pops.A} v ${al.pops.B}. ${al.A ? `Europe get ${al.A}` : al.B ? `USA get ${al.B}` : 'No strokes'}.`

      ${(bs => bs ? `Biggest swing: hole ${bs.hole}, <b class="${bs.swing > 0 ? 'eur' : 'usa'}">${bs.swing > 0 ? '+' : ''}${Math.round(bs.swing * 100)} pts</b> for Europe.` : '')(m.swings[state.model])}</p>

  function renderMatches() {

  function renderPlayers() {

            ${col('hw', 'Won', 'num cw')}${col('hl', 'Lost', 'num cl')}${col('hh', 'Halved', 'num chh')}${col('net', 'Net', 'num')}
            <th>Match results</th>${col('mediaCount', 'Media')}</tr>

        </tbody>

      </table></div>`;
  }


  function renderHoles() {
    const HS = A.holeStats;
    const mmss = v => { if (v == null) return '–'; const t = Math.round(v * 60), mi = Math.floor(t / 60), se = t % 60; return se ? `${mi}m ${se}s` : `${mi}m`; };
    const hm = v => { const t = Math.round(v); return `${Math.floor(t / 60)}h ${String(t % 60).padStart(2, '0')}m`; };
    const pace = HS.filter(s => s.medianMin != null);
    const maxBy = (arr, f) => arr.reduce((a, b) => f(b) > f(a) ? b : a), minBy = (arr, f) => arr.reduce((a, b) => f(b) < f(a) ? b : a);
    const tags = {};
    const tag = (h, t, cls) => { (tags[h] = tags[h] || []).push(`<span class="htag ${cls}">${t}</span>`); };
    // ties go to the hole played more often
    tag(maxBy(HS, s => s.decisive + s.n * 1e-6).hole, 'Fewest halves', 'hot');
    tag(minBy(HS, s => s.decisive - s.n * 1e-6).hole, 'Most halves', 'cool');
    tag(maxBy(HS, s => s.A - s.B).hole, 'Best for Europe', 'eu');
    tag(maxBy(HS, s => s.B - s.A).hole, 'Best for USA', 'us');
    if (pace.length) { tag(maxBy(pace, s => s.medianMin).hole, 'Slowest', 'slow'); tag(minBy(pace, s => s.medianMin).hole, 'Quickest', 'fast'); }
    const edge = (a, b) => a === b ? '<span class="edge evn">Even</span>' : `<span class="edge ${a > b ? 'eu' : 'us'}">${a > b ? 'EUR' : 'USA'} +${Math.abs(a - b)}</span>`;
    const outBar = d => `<div class="obar" aria-hidden="true"><i style="width:${d * 100}%"></i></div>`;
    const row = s => `<tr class="hrow p${s.par}">
        <td class="hn"><span class="hchip">${s.hole}</span></td>
        <td class="parcell"><span class="par p${s.par}">Par ${s.par}</span>${tags[s.hole] ? `<div class="tags">${tags[s.hole].join('')}</div>` : ''}</td><td class="num">${s.yards}</td><td class="num">${s.hcp}</td>
        <td class="num">${s.n}</td>
        <td class="num ceu">${s.A}</td><td class="num chh">${s.H}</td><td class="num cus">${s.B}</td>
        <td class="barcell">${bar(s.A, s.H, s.B)}</td>
        <td>${edge(s.A, s.B)}</td>
        <td class="num"><b>${pct(s.decisive)}</b>${outBar(s.decisive)}</td>
        <td class="num">${mmss(s.medianMin)}</td></tr>`;
    const sub = (label, hs) => {
      const t = hs.reduce((o, s) => ({ A: o.A + s.A, H: o.H + s.H, B: o.B + s.B, n: o.n + s.n, y: o.y + s.yards, p: o.p + s.par, m: o.m + (s.medianMin || 0) }), { A: 0, H: 0, B: 0, n: 0, y: 0, p: 0, m: 0 });
      return `<tr class="hsub"><td colspan="2">${label}</td><td class="num">${t.y.toLocaleString()}</td><td></td><td class="num">${t.n}</td>
        <td class="num ceu">${t.A}</td><td class="num chh">${t.H}</td><td class="num cus">${t.B}</td><td class="barcell">${bar(t.A, t.H, t.B)}</td>
        <td>${edge(t.A, t.B)}</td><td class="num"><b>${pct((t.A + t.B) / t.n)}</b></td><td class="num">${hm(t.m)}</td></tr>`;
    };
    $('#v-holes').innerHTML = `
      <p class="lede">How every hole played across all 30 matches.</p>
      <div class="hkey">
        <p><b>Won outright</b> is the share of times someone won the hole instead of halving it. High means the hole usually decided something; low means it was usually halved.</p>
        <p><b>Edge</b> is holes won by Europe minus holes won by USA. <b>Time per hole</b> is the typical (median) gap between saving one hole and the next, using only saves that look live. Nine totals add those up.</p>
      </div>
      <div class="hcard"><table class="htable">
        <thead>
          <tr class="grp"><th colspan="4">The hole</th><th colspan="6">Results</th><th colspan="2">How it played</th></tr>
          <tr><th>Hole</th><th>Par</th><th class="num">Yds</th><th class="num">Hcp</th><th class="num">Played</th>
            <th class="num ceu">EUR won</th><th class="num chh">Halved</th><th class="num cus">USA won</th><th>Split</th><th>Edge</th>
            <th class="num">Won outright</th><th class="num">Time per hole</th></tr>
        </thead>
        <tbody>
          <tr class="hsec"><td colspan="12">Front nine</td></tr>
          ${HS.slice(0, 9).map(row).join('')}
          ${sub('Front nine total', HS.slice(0, 9))}
          <tr class="hsec"><td colspan="12">Back nine</td></tr>
          ${HS.slice(9).map(row).join('')}
          ${sub('Back nine total', HS.slice(9))}
        </tbody>
      </table></div>
      <p class="meta">Played counts matches that reached the hole; later holes have fewer because matches ended early. Hole 1 has no time per hole because there is no earlier save to measure from. Saves are recorded to the minute, so times are to the half minute.</p>`;
  }


  /* ---------- timeline (replay) ---------- */
  const KIND = { 'round-start': 'Round underway', 'round-end': 'Round complete', 'lead-change': 'Lead change', run: 'Hot streak',
    final: 'Match over', clinch: 'Cup decided', note: 'From the course', photo: 'Photo' };
  const BIG = new Set(['round-start', 'round-end', 'lead-change', 'run', 'final', 'clinch']);
  const sideSpan = (m, side) => `<span class="${side === 'A' ? 'eur' : 'usa'}">${names(m[side.toLowerCase()])}</span>`;
  const cupAt = t => { let a = 0, b = 0; A.matches.forEach(m => { if (m.done && m.end <= t) { a += m.points.A; b += m.points.B; } }); return { A: a, B: b }; };
  const cupTxt = c => `Europe ${half(c.A) || 0} – USA ${half(c.B) || 0}`;
  // holes known at time t: consecutive holes from 1 saved at or before t
  function stateAt(m, t) {
    let k = 0; while (k < m.holes.length && m.holes[k].ts <= t) k++;
    if (!k) return { started: false };
    const p = m.holes[k - 1], fin = m.done && k === m.holes.length;
    return { started: true, thru: k, lead: p.lead, fin };
  }
  const leadLabel = lead => lead === 0 ? 'AS' : `${T[lead > 0 ? 'A' : 'B'].short} ${Math.abs(lead)}UP`;

  function timelineEvents() {
    const ev = A.moments.map(e => ({ ...e }));
    [1, 2, 3, 4].forEach(r => {
      const ms = A.matches.filter(m => m.round === r && m.holes.length);
      if (!ms.length) return;
      const first = ms.map(m => m.holes[0].ts).sort()[0];
      ev.push({ kind: 'round-start', round: r, ts: first, reliable: true });
      if (ms.every(m => m.done)) {
        const last = ms.map(m => m.end).sort().pop();
        ev.push({ kind: 'round-end', round: r, ts: last, reliable: true });
      }
    });
    const order = { 'round-start': 0, 'lead-change': 1, run: 2, note: 3, photo: 3, final: 4, 'round-end': 5, clinch: 6 };
    return ev.sort((x, y) => x.ts < y.ts ? -1 : x.ts > y.ts ? 1 : order[x.kind] - order[y.kind]);
  }

  function eventCard(e) {
    const m = e.match ? A.matches.find(x => x.id === e.match) : null;
    const R = K.ROUNDS[e.round || (m && m.round)];
    const approx = e.reliable === false;
    const time = `<time datetime="${esc(e.ts)}" title="${approx ? 'Approximate: batch or edited save' : 'Time the hole was saved'}">${approx ? '~' : ''}${tm(e.ts)}</time>`;
    const where = m ? `<a href="#matches/${m.id}">${R.formatLabel} · Match ${m.group}</a>${e.hole ? `, hole ${e.hole}` : ''}` : '';
    const at = m && e.hole ? m.holes[e.hole - 1] : null;
    const status = at ? `${leadLabel(at.lead)} thru ${e.hole}` : '';
    let cls = e.kind, head = '', sub = '', extra = '', side = e.side || '';
    switch (e.kind) {
      case 'round-start': {
        const c = cupAt(e.ts);
        head = `${R.label} underway`; sub = `${R.formatLabel}, ${A.matches.filter(x => x.round === e.round).length} matches. Cup: ${cupTxt(c)}`; break;
      }
      case 'round-end': {
        const r = A.byRound[e.round], c = cupAt(e.ts);
        side = r.A > r.B ? 'A' : r.B > r.A ? 'B' : '';
        head = `${R.label} complete: Europe ${half(r.A) || 0} – USA ${half(r.B) || 0}`;
        sub = `Cup standings: <b>${cupTxt(c)}</b>`; break;
      }
      case 'lead-change': head = `${sideSpan(m, e.side)} take the lead`; sub = `${where}. ${status}`; break;
      case 'run': head = `${sideSpan(m, e.side)} win ${e.len} holes in a row`; sub = `${where}. Holes ${e.from}–${e.from + e.len - 1}, now ${status}`; break;
      case 'final': {
        const c = cupAt(e.ts);
        head = e.side ? `${sideSpan(m, e.side)} win ${esc(e.label)}` : `${sideSpan(m, 'A')} and ${sideSpan(m, 'B')} halve`;
        sub = `${where}. ${e.side ? `Beat ${names(m[e.side === 'A' ? 'b' : 'a'])}.` : ''}`;
        extra = `<div class="cupnow">Cup: <b class="eur">Europe ${half(c.A) || 0}</b> – <b class="usa">USA ${half(c.B) || 0}</b></div>`; break;
      }
      case 'clinch': {
        const c = cupAt(e.ts);
        head = e.side === 'A' ? 'Europe win the Kiva Cup' : 'USA retain the Kiva Cup';
        sub = `${names(m[e.side.toLowerCase()])} win ${esc(m.label)} for point number ${half(e.side === 'A' ? c.A : c.B)}. ${cupTxt(c)} at that moment.`; break;
      }
      case 'note': head = `“${esc(e.text)}”`; sub = `${where}. ${at ? (at.result === 'H' ? 'Hole halved' : T[at.result].name + ' won the hole') + ', ' + status : ''}`; break;
      default: head = 'Photo'; sub = `${where}. ${status}`;
    }
    const photo = e.photo && (e.kind === 'note' || e.kind === 'photo') ? `<a class="ph" href="${esc(e.photo)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(e.thumb)}" data-full="${esc(e.photo)}" alt="Photo, ${esc(e.match)} hole ${e.hole}"></a>` : '';
    return `<li class="ev ${cls} ${side ? 's' + side : ''} ${BIG.has(e.kind) ? 'big' : 'small'}" data-ts="${esc(e.ts)}" data-round="${e.round || (m && m.round)}">
      <div class="when">${time}</div>
      <div class="card"><span class="nowtag">Now showing</span><span class="pill">${KIND[e.kind]}</span><div class="head">${head}</div><div class="sub">${sub}</div>${extra}${photo}</div></li>`;
  }

  function clockSVG(ts) {
    const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: K.EVENT.tz, hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(new Date(ts)).map(p => [p.type, p.value]));
    const h = +parts.hour % 12, mi = +parts.minute, ha = (h + mi / 60) * 30, ma = mi * 6;
    let ticks = '';
    for (let i = 0; i < 12; i++) ticks += `<line x1="50" y1="${i % 3 ? 9 : 7}" x2="50" y2="${i % 3 ? 13 : 16}" stroke="var(--bg)" stroke-width="${i % 3 ? 2 : 3.5}" transform="rotate(${i * 30} 50 50)"/>`;
    return `<svg viewBox="0 0 100 100" class="clock" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#FFFFFF" stroke="var(--gold)" stroke-width="5"/>${ticks}
      <line x1="50" y1="50" x2="50" y2="27" stroke="var(--bg)" stroke-width="6" stroke-linecap="round" transform="rotate(${ha} 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="15" stroke="var(--bg)" stroke-width="3.5" stroke-linecap="round" transform="rotate(${ma} 50 50)"/>
      <circle cx="50" cy="50" r="4.5" fill="#CC3333"/></svg>`;
  }

  function renderReplay(ts) {
    const box = document.getElementById('replay'); if (!box || !ts) return;
    const c = cupAt(ts);
    // round in play at ts: latest round that had started by ts
    let rd = 1; [1, 2, 3, 4].forEach(r => { if (A.matches.some(m => m.round === r && m.holes[0] && m.holes[0].ts <= ts)) rd = r; });
    const ms = A.matches.filter(m => m.round === rd);
    const st = ms.map(m => ({ m, s: stateAt(m, ts) }));
    const live = st.filter(x => x.s.started && !x.s.fin).length;
    const chips = st.map(({ m, s }) => {
      let cls = 'idle', txt = 'No holes in yet';
      if (s.started) {
        const lead = s.lead;
        cls = lead > 0 ? 'A' : lead < 0 ? 'B' : 'AS';
        txt = s.fin ? `<span class="tag">FINAL</span>${m.winner ? `${T[m.winner].short} won ${m.label}` : 'Halved'}` : `${leadLabel(lead)} thru ${s.thru}`;
        if (!s.fin) cls += ' live';
      }
      return `<a class="chip2 ${cls}" href="#matches/${m.id}"><span class="g">M${m.group}</span><span class="nm">${m.a.map(esc).join('/')} v ${m.b.map(esc).join('/')}</span><b>${txt}</b></a>`;
    }).join('');
    const need = 15.5;
    box.innerHTML = `
      <div class="rp-top">
        ${clockSVG(ts)}
        <div class="rp-time"><b>${tm(ts)}</b><span>${dayOf(ts)} CDT</span><span>${K.ROUNDS[rd].label}, ${K.ROUNDS[rd].formatLabel}${live ? ` · ${live} on course` : ''}</span></div>
      </div>
      <div class="rp-cup">
        <div class="rp-team A"><span>Europe</span><b>${half(c.A) || 0}</b></div>
        <div class="rp-team B"><b>${half(c.B) || 0}</b><span>USA</span></div>
        <div class="rp-bar" role="img" aria-label="${cupTxt(c)}"><i class="A" style="width:${c.A / 30 * 100}%"></i><i class="B" style="width:${c.B / 30 * 100}%"></i><em style="left:${need / 30 * 100}%"></em></div>
        <div class="rp-need">15½ wins the Cup. USA keep it at 15.</div>
      </div>
      <div class="rp-matches">${chips}</div>`;
  }

  function renderTimeline() {
    const evs = timelineEvents().filter(e => (state.tlRound === 'all' || +(e.round || 0) === state.tlRound) && (state.tlAll || BIG.has(e.kind)));
    let lastDay = '', html = '';
    evs.forEach(e => {
      const d = dayOf(e.ts);
      if (d !== lastDay) { if (lastDay) html += '</ol>'; html += `<h2 class="tl-day">${d}</h2><ol class="tl2">`; lastDay = d; }
      html += eventCard(e);
    });
    if (lastDay) html += '</ol>';
    $('#v-timeline').innerHTML = `
      <div class="tl-how"><b>How this works:</b> the panel shows the Cup at the moment outlined in gold, marked <span class="nowtag">Now showing</span>. Scroll the list to move through time, or tap any moment to jump to it. Times are CDT; ~ marks an approximate time.</div>
      <div class="tl-controls">
        <div class="seg" role="group" aria-label="Round">${[['all', 'All rounds'], [1, 'Round 1'], [2, 'Round 2'], [3, 'Round 3'], [4, 'Round 4']].map(([k, l]) => `<button data-tlround="${k}" aria-pressed="${state.tlRound === k}">${l}</button>`).join('')}</div>
        <div class="seg" role="group" aria-label="Show">${[[false, 'Big moments'], [true, 'Everything']].map(([k, l]) => `<button data-tlall="${k}" aria-pressed="${state.tlAll === k}">${l}</button>`).join('')}</div>
      </div>
      <div class="tl-wrap">
        <aside id="replay" class="replay" aria-live="polite"></aside>
        <div class="tl-stream">${html || '<p class="status">No moments for this round with the current setting. Choose Everything to include notes and photos.</p>'}</div>
      </div>`;
    state.tlCur = null; syncReplay();
  }

  function syncReplay() {
    const v = document.getElementById('v-timeline');
    if (!v || !v.classList.contains('on')) return;
    const items = v.querySelectorAll('.ev'); if (!items.length) return;
    const line = window.innerHeight * (window.innerWidth < 900 ? .55 : .4);
    let cur = items[0];
    for (const it of items) { if (it.getBoundingClientRect().top <= line) cur = it; else break; }
    if (cur === state.tlCur && cur.dataset.ts === state.tlTs) return;
    if (state.tlCur && state.tlCur !== cur) state.tlCur.classList.remove('cur');
    cur.classList.add('cur'); state.tlCur = cur;
    if (cur.dataset.ts !== state.tlTs) { state.tlTs = cur.dataset.ts; renderReplay(cur.dataset.ts); }
  }
  let tlRaf = 0;
  window.addEventListener('scroll', () => { if (!tlRaf) tlRaf = requestAnimationFrame(() => { tlRaf = 0; syncReplay(); }); }, { passive: true });

  /* ---------- win % readout ---------- */
  const fmtPct = p => p <= 0 ? '0%' : p >= 1 ? '100%' : p < .005 ? '<1%' : p > .995 ? '>99%' : Math.round(p * 100) + '%';
  function showHole(id, i) {
    const m = A.matches.find(x => x.id === id), ro = document.getElementById('ro-' + id);
    const svg = document.querySelector(`.leadchart[data-match="${id}"]`);
    if (!m || !ro || !svg) return;
    i = Math.max(0, Math.min(m.thru, i)); state.hole[id] = i;
    const pr = m.probs[state.model][i], p = i ? m.holes[i - 1] : null, lead = p ? p.lead : 0;
    const status = lead === 0 ? 'All square' : `${T[lead > 0 ? 'A' : 'B'].name} ${Math.abs(lead)} up`;
    const last = i === m.thru && m.done;
    const where = i === 0 ? 'Before the first tee' : last ? `Final after hole ${i}: ${m.winner ? `${T[m.winner].name} win ${m.label}` : 'match halved'}` : `After hole ${i}: ${status}, ${18 - i} to play`;
    const edgeTxt = st => { const e = st.A - st.B; return e ? ` ${T[e > 0 ? 'A' : 'B'].name} had a stroke edge.` : ''; };
    const what = i === 0 ? (state.model === 'strokes' ? 'Starting odds reflect who gets strokes on which holes.' : 'Every match starts even.') :
      `Hole ${i} (par ${K.COURSE.par[i - 1]}, hcp ${K.COURSE.hcp[i - 1]}): ${p.result === 'H' ? 'halved' : T[p.result].name + ' won'}.${state.model === 'strokes' ? edgeTxt(p.strokes) : ''} ` +
      (Math.abs(pr.swing) >= .005 ? `Europe's chance ${pr.swing > 0 ? 'up' : 'down'} ${Math.round(Math.abs(pr.swing) * 100)} pts.` : 'No change.');
    ro.innerHTML = `<div><div class="where">${esc(where)}</div><div class="what">${esc(what)}</div></div>
      <div class="pct">${fmtPct(pr.share)}<small>Europe win %</small></div>
      <div class="split" role="img" aria-label="Europe win ${fmtPct(pr.A)}, halve ${fmtPct(pr.H)}, USA win ${fmtPct(pr.B)}"><i style="width:${pr.A * 100}%;background:var(--eur)"></i><i style="width:${pr.H * 100}%;background:var(--half)"></i><i style="width:${pr.B * 100}%;background:var(--usa)"></i></div>
      <div class="legend"><span class="eur">Europe win ${fmtPct(pr.A)}</span>, halved ${fmtPct(pr.H)}, <span class="usa">USA win ${fmtPct(pr.B)}</span></div>`;
    const c = m._chart, hl = svg.querySelector('.hl');
    hl.querySelector('line').setAttribute('x1', c.x(i)); hl.querySelector('line').setAttribute('x2', c.x(i));
    const hp = hl.querySelector('.hl-p'), hlc = hl.querySelector('.hl-l');
    hp.setAttribute('cx', c.x(i)); hp.setAttribute('cy', c.yp(pr.share));
    hlc.setAttribute('cx', c.x(i)); hlc.setAttribute('cy', c.y(lead)); hlc.style.display = i ? '' : 'none';
  }
  document.addEventListener('pointerover', e => { const r = e.target.closest && e.target.closest('.leadchart .hit'); if (r) showHole(r.closest('svg').dataset.match, +r.dataset.i); });
  document.addEventListener('keydown', e => {
    const svg = e.target.closest && e.target.closest('.leadchart'); if (!svg) return;
    const id = svg.dataset.match, cur = state.hole[id] || 0;
    if (e.key === 'ArrowRight') { showHole(id, cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { showHole(id, cur - 1); e.preventDefault(); }
    else if (e.key === 'Home') { showHole(id, 0); e.preventDefault(); }
    else if (e.key === 'End') { showHole(id, 18); e.preventDefault(); }
  });

  /* ---------- routing + events ---------- */
  function route() {
    const [view, arg] = (location.hash.slice(1) || 'overview').split('/');
    const v = ['overview', 'matches', 'players', 'holes', 'timeline'].includes(view) ? view : 'overview';
    document.querySelectorAll('section.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
    document.querySelectorAll('nav.tabs a').forEach(a => { if (a.getAttribute('href') === '#' + v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    state.view = v; renderHeader();
    if (v === 'matches' && arg) {
      const m = A.matches.find(x => x.id === arg);
      if (m) { state.round = m.round; state.open = m.id; renderMatches(); requestAnimationFrame(() => document.getElementById('m-' + m.id).scrollIntoView({ block: 'start' })); }
    } else if (v !== 'matches') window.scrollTo(0, 0);
    if (v === 'timeline') { if (!state.tlBuilt) { state.tlBuilt = true; renderTimeline(); } state.tlTs = null; state.tlCur = null; syncReplay(); }
  }

  document.addEventListener('click', e => {
    const evc = e.target.closest && e.target.closest('.tl2 .ev');
    if (evc && !e.target.closest('a')) {
      const line = window.innerHeight * (window.innerWidth < 900 ? .55 : .4);
      window.scrollBy({ top: evc.getBoundingClientRect().top - line + 2, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      return;
    }
    const hit = e.target.closest && e.target.closest('.leadchart .hit');
    if (hit) { showHole(hit.closest('svg').dataset.match, +hit.dataset.i); return; }
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.tlround) { const v = b.dataset.tlround; state.tlRound = v === 'all' ? 'all' : +v; state.tlTs = null; renderTimeline(); window.scrollTo(0, document.querySelector('nav.tabs').offsetTop); return; }
    if (b.dataset.tlall) { state.tlAll = b.dataset.tlall === 'true'; state.tlTs = null; renderTimeline(); return; }
    if (b.dataset.model) { state.model = b.dataset.model; renderMatches(); }
    else if (b.dataset.round) { state.round = +b.dataset.round; state.open = null; history.replaceState(null, '', '#matches'); renderMatches(); renderHeader(); }
    else if (b.dataset.match) { const id = b.dataset.match; state.open = state.open === id ? null : id; history.replaceState(null, '', state.open ? '#matches/' + id : '#matches'); renderMatches(); }
    else if (b.dataset.sort) { const k = b.dataset.sort; state.sort = state.sort.key === k ? { key: k, dir: -state.sort.dir } : { key: k, dir: k === 'name' || k === 'hcp' ? 1 : -1 }; renderPlayers(); }
    else if (b.dataset.team) { state.team = b.dataset.team; renderPlayers(); }
  });
  // older photos have no -thumb.jpg; fall back to the full image
  // Some older photos have no -thumb.jpg. Instead of downloading the full-size photo (~0.4 MB each)
  // just to show a small preview, swap in a lightweight tile; the link still opens the full photo.
  document.addEventListener('error', e => {
    const i = e.target; if (i.tagName !== 'IMG' || !i.dataset.full) return;
    const tile = document.createElement('span'); tile.className = 'notile'; tile.style.width = i.offsetWidth ? i.offsetWidth + 'px' : '';
    tile.style.height = i.offsetHeight ? i.offsetHeight + 'px' : ''; tile.textContent = 'View photo';
    i.replaceWith(tile);
  }, true);
  window.addEventListener('hashchange', route);
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (A && state.open) renderMatches(); }, 200); });

  // sticky header: compact after scrolling, and publish its height for other sticky elements
  const stick = document.getElementById('stick');
  const setStickH = () => document.documentElement.style.setProperty('--stick-h', stick.offsetHeight + 'px');
  if (window.ResizeObserver) new ResizeObserver(setStickH).observe(stick); else window.addEventListener('resize', setStickH);
  setStickH();
  window.addEventListener('scroll', () => {
    const y = window.scrollY, h = document.getElementById('hero').offsetHeight;
    if (y > h + 90 && !stick.classList.contains('compact')) stick.classList.add('compact');
    else if (y < h + 10 && stick.classList.contains('compact')) stick.classList.remove('compact');
  }, { passive: true });

  load().then(rows => {
    A = K.analyze(rows);
    window.KIVA = A; // handy in the console
    $('#status').remove();
    renderHeader(); renderOverview(); renderMatches(); renderPlayers(); renderHoles(); route();
  }).catch(err => {
    $('#status').className = 'status err';
    $('#status').textContent = `Could not load hole results from Supabase: ${err.message}. Check the project URL and publishable key at the top of the script, and that kiva_holes allows public reads.`;
    $('#verdict').textContent = 'No data';
  });
})();
</script>
</body>
</html>
